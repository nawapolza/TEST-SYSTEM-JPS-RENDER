services:
  - type: web
    name: oil-management-system-fixed-1-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /health-ready
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: test_system_jps
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE_SECONDS
        value: "604800"
      - key: UPLOAD_MAX_MB
        value: "5"
      - key: CORS_ALLOW_ALL
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        value: https://oil-management-system-fixed.onrender.com
      - key: APP_TIMEZONE
        value: Asia/Bangkok

  - type: web
    name: oil-management-system-fixed
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --include=dev --no-audit --no-fund && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: VITE_API_URL
        value: https://oil-management-system-fixed-1-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
